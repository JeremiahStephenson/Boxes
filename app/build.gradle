import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jlleitschuh.gradle.ktlint.reporter.ReporterType

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.parcelize)
    alias(libs.plugins.ksp)
    alias(libs.plugins.google.services)
    alias(libs.plugins.crashlytics)
    alias(libs.plugins.ben.manes.versions)
    alias(libs.plugins.ktlint)
}

android {
    namespace 'com.jerry.shapes'
    compileSdk 37

    defaultConfig {
        applicationId "com.jerry.shapes"
        minSdk 24
        targetSdk 37
        versionCode 3
        versionName "1.02"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    ktlint {
        android.set(true) // Enables Android-specific rules
        ignoreFailures.set(false) // Fails the build if issues are found
        reporters {
            reporter(ReporterType.PLAIN)
        }
    }

    signingConfigs {
        release {
            keyAlias 'RouteSucks'
            keyPassword 'RouteSucks'
            storeFile file('../../key.jks')
            storePassword 'RouteSucks'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_21
            freeCompilerArgs.addAll(
                    "-opt-in=kotlin.RequiresOptIn",
                    "-opt-in=androidx.compose.animation.ExperimentalAnimationApi",
                    "-opt-in=androidx.lifecycle.compose.ExperimentalLifecycleComposeApi",
                    "-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi",
                    "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
                    "-Xjvm-default=all-compatibility"
            )
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }
    packaging {
        resources {
            excludes.add('/META-INF/{AL2.0,LGPL2.1}')
            excludes.add('META-INF/LICENSE.md')
            excludes.add('META-INF/LICENSE-notice.md')
        }
    }
}

